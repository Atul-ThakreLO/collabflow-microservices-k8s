---
# ── MongoDB for Auth Service ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-auth
  namespace: collabflow
  labels:
    app: mongo-auth
    tier: database
spec:
  serviceName: mongo-auth
  replicas: 1
  selector:
    matchLabels:
      app: mongo-auth
  template:
    metadata:
      labels:
        app: mongo-auth
        tier: database
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: collabflow_auth
          volumeMounts:
            - name: mongo-auth-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mongo-auth-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard  # Change to your storageClass
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-auth
  namespace: collabflow
  labels:
    app: mongo-auth
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: mongo-auth
  ports:
    - port: 27017
      targetPort: 27017

