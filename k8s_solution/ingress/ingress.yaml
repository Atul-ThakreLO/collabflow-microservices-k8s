---
# ── Ingress for CollabFlow ────────────────────────────────────────────────────
# Requires: nginx ingress controller installed
# Install: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
# For local (minikube): minikube addons enable ingress
# For kind: https://kind.sigs.k8s.io/docs/user/ingress/

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabflow-ingress
  namespace: collabflow
  labels:
    app: collabflow
  annotations:
    # nginx ingress annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # SSL (enable when cert-manager is installed)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # CORS headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://collabflow.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - collabflow.io
  #       - api.collabflow.io
  #     secretName: collabflow-tls
  rules:
    # Frontend
    - host: collabflow.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # API — separate subdomain for cleaner routing
    - host: api.collabflow.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000

---
# ── Local development Ingress (no TLS, uses localhost) ───────────────────────
# Use this when testing locally with minikube
# Add to /etc/hosts: <minikube-ip> collabflow.local api.collabflow.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabflow-ingress-local
  namespace: collabflow
  labels:
    app: collabflow
    env: local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    - host: collabflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.collabflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
