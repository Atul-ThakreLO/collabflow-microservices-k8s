---
# ── CronJob: Detect overdue tasks every hour ──────────────────────────────────
# Alternatively, the task-service already handles this with node-cron.
# This K8s CronJob is the "proper" way to do it — decoupled from the service.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: overdue-task-checker
  namespace: collabflow
  labels:
    app: overdue-checker
    tier: batch
spec:
  schedule: "0 * * * *"      # Every hour at minute 0
  timeZone: "Asia/Kolkata"   # Use your timezone
  concurrencyPolicy: Forbid  # Don't allow concurrent runs
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2          # Retry up to 2 times on failure
      activeDeadlineSeconds: 300  # Kill job if running > 5 min
      template:
        metadata:
          labels:
            app: overdue-checker
        spec:
          restartPolicy: OnFailure
          serviceAccountName: collabflow-service-account
          containers:
            - name: overdue-checker
              image: curlimages/curl:8.4.0
              command:
                - /bin/sh
                - -c
                - |
                  echo "Checking overdue tasks..."
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
                    -X GET http://task-service:3003/api/tasks/overdue \
                    -H "x-user-id: system" \
                    -H "x-user-role: admin")
                  if [ "$RESPONSE" = "200" ]; then
                    echo "Overdue check completed successfully"
                  else
                    echo "Overdue check failed with HTTP $RESPONSE"
                    exit 1
                  fi
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000

---
# ── Job: Database migration / seed (run once on deploy) ──────────────────────
# Useful for seeding initial data or running migrations
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: collabflow
  labels:
    app: db-seed
    tier: migration
  annotations:
    # Helm hook equivalent for run-once semantics:
    # "helm.sh/hook": post-install
    # "helm.sh/hook-delete-policy": hook-succeeded
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: db-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-seed
          image: mongo:7.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database seed..."
              mongosh mongodb://mongo-auth:27017/collabflow_auth --eval "
                db.authusers.createIndex({ email: 1 }, { unique: true });
                print('Auth DB indexes created');
              "
              echo "Seed completed"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
