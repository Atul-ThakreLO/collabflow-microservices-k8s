---
# ── Auth Service (ClusterIP — internal only) ──────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: collabflow
  labels:
    app: auth-service
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP

---
# ── User Service ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: collabflow
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002

---
# ── Task Service ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: collabflow
  labels:
    app: task-service
spec:
  type: ClusterIP
  selector:
    app: task-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003

---
# ── Notification Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: collabflow
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 3004
      targetPort: 3004

---
# ── Analytics Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: collabflow
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 3005
      targetPort: 3005

---
# ── API Gateway (accessible from outside via Ingress) ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: collabflow
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
# ── Frontend Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: collabflow
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
# ── RabbitMQ Management (NodePort for dev access) ─────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: collabflow
  labels:
    app: rabbitmq
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 31672  # Access via http://<node-ip>:31672
