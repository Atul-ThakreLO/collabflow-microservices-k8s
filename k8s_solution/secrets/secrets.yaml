---
# IMPORTANT: In real production, use Sealed Secrets, Vault, or External Secrets Operator
# Values below are BASE64 encoded. Use: echo -n 'value' | base64

# ── Auth Secrets ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: collabflow
  labels:
    app: auth-service
type: Opaque
data:
  # echo -n 'your-super-secret-jwt-key-min-32-chars' | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1taW4tMzItY2hhcnM=
  # echo -n 'your-refresh-token-secret-min-32-chars' | base64
  JWT_REFRESH_SECRET: eW91ci1yZWZyZXNoLXRva2VuLXNlY3JldC1taW4tMzItY2hhcnM=

---
# ── RabbitMQ Credentials ──────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: collabflow
  labels:
    app: rabbitmq
type: Opaque
data:
  # echo -n 'admin' | base64
  RABBITMQ_DEFAULT_USER: YWRtaW4=
  # echo -n 'StrongPassword123!' | base64
  RABBITMQ_DEFAULT_PASS: U3Ryb25nUGFzc3dvcmQxMjMh
  # Full connection URL
  # echo -n 'amqp://admin:StrongPassword123!@rabbitmq:5672' | base64
  RABBITMQ_URL: YW1xcDovL2FkbWluOlN0cm9uZ1Bhc3N3b3JkMTIzIUByYWJiaXRtcTo1Njcy

---
# ── MongoDB Credentials ───────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: collabflow
  labels:
    app: mongodb
type: Opaque
data:
  # echo -n 'mongopassword' | base64
  MONGO_ROOT_PASSWORD: bW9uZ29wYXNzd29yZA==
  MONGO_USERNAME: YWRtaW4=

---
# ── SMTP Credentials ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: smtp-credentials
  namespace: collabflow
  labels:
    app: notification-service
type: Opaque
data:
  # echo -n 'your-smtp-username' | base64
  SMTP_USER: eW91ci1zbXRwLXVzZXJuYW1l
  # echo -n 'your-smtp-password' | base64
  SMTP_PASS: eW91ci1zbXRwLXBhc3N3b3Jk
