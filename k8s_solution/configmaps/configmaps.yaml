---
# ConfigMap: API Gateway
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: collabflow
  labels:
    app: api-gateway
data:
  PORT: "3000"
  NODE_ENV: "production"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  USER_SERVICE_URL: "http://user-service:3002"
  TASK_SERVICE_URL: "http://task-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3005"
  CORS_ORIGIN: "http://collabflow.io,https://collabflow.io"
  LOG_LEVEL: "info"
  APP_VERSION: "1.0.0"

---
# ConfigMap: Auth Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: collabflow
  labels:
    app: auth-service
data:
  PORT: "3001"
  NODE_ENV: "production"
  MONGO_URI: "mongodb://mongo-auth:27017/collabflow_auth"
  JWT_EXPIRES_IN: "15m"
  LOG_LEVEL: "info"
  APP_VERSION: "1.0.0"

---
# ConfigMap: User Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: collabflow
  labels:
    app: user-service
data:
  PORT: "3002"
  NODE_ENV: "production"
  MONGO_URI: "mongodb://mongo-users:27017/collabflow_users"
  REDIS_URL: "redis://redis:6379"
  LOG_LEVEL: "info"

---
# ConfigMap: Task Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-service-config
  namespace: collabflow
  labels:
    app: task-service
data:
  PORT: "3003"
  NODE_ENV: "production"
  MONGO_URI: "mongodb://mongo-tasks:27017/collabflow_tasks"
  LOG_LEVEL: "info"

---
# ConfigMap: Notification Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: collabflow
  labels:
    app: notification-service
data:
  PORT: "3004"
  NODE_ENV: "production"
  MONGO_URI: "mongodb://mongo-notifications:27017/collabflow_notifications"
  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  EMAIL_FROM: '"CollabFlow" <noreply@collabflow.io>'
  LOG_LEVEL: "info"

---
# ConfigMap: Analytics Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: collabflow
  labels:
    app: analytics-service
data:
  PORT: "3005"
  NODE_ENV: "production"
  MONGO_URI: "mongodb://mongo-analytics:27017/collabflow_analytics"
  LOG_LEVEL: "info"

---
# ConfigMap: RabbitMQ connection (shared)
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: collabflow
data:
  RABBITMQ_URL: "amqp://admin:$(RABBITMQ_PASSWORD)@rabbitmq:5672"
