apiVersion: batch/v1
kind: CronJob
metadata:
  name: overdue-task-checker
  namespace: collabflow
  labels:
    app: overdue-checker
    tier: batch
spec:
  schedule: "0 * * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: overdue-checker
        spec:
          restartPolicy: OnFailure
          serviceAccountName: collabflow-service-account
          containers:
            - name: overdue-checker
              image: curlimages/curl:8.4.0
              command:
                - /bin/sh
                - -c
                - |
                  echo "Checking overdue tasks..."
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
                    -X GET http://task-service:3003/api/tasks/overdue \
                    -H "x-user-id: system" \
                    -H "x-user-role: admin")
                  if [ "$RESPONSE" = "200" ]; then
                    echo "Overdue check completed successfully"
                  else
                    echo "Overdue check failed with HTTP $RESPONSE"
                    exit 1
                  fi
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
              # securityContext:
              #   allowPrivilegeEscalation: false
              #   readOnlyRootFilesystem: true
              #   runAsNonRoot: true
              #   runAsUser: 1000
