apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: collabflow
  labels:
    app: db-seed
    tier: migration
  annotations:
    # Helm hook equivalent for run-once semantics:
    # "helm.sh/hook": post-install
    # "helm.sh/hook-delete-policy": hook-succeeded
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: db-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-seed
          image: mongo:7.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database seed..."
              mongosh mongodb://mongo-auth:27017/collabflow_auth --eval "
                db.authusers.createIndex({ email: 1 }, { unique: true });
                print('Auth DB indexes created');
              "
              echo "Seed completed"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
