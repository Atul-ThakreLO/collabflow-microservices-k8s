---
################################################################################
################################# StatefulSet ##################################
################################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-auth
  namespace: collabflow 
  labels:
    name: mongo-auth
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mongo-auth
      tier: database
  template:
    metadata:
      labels:
        name: mongo-auth
        tier: database
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports: 
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: collabflow_auth

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          volumeMounts:
            - name: mongo-auth-data
              mountPath: /data/db
              
  volumeClaimTemplates:
    - metadata:
        name: mongo-auth-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Mi

---

################################################################################
################################### Service ####################################
################################################################################

apiVersion: v1
kind: Service
metadata:
  name: mongo-auth
  namespace: collabflow
  labels:
    name: mongo-auth
    tier: network
spec:
  clusterIP: None
  selector:
    name: mongo-auth
    tier: database
  ports:
    - port: 27017
      targetPort: 27017
    
   