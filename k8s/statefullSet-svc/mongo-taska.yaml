---
################################################################################
################################# StatefulSet ##################################
################################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-tasks
  namespace: collabflow 
  labels:
    name: mongo-tasks
    tier: database
spec:
  replica: 1
  selector:
    matchLables:
      name: mongo-tasks
      tier: database
  template:
    metadata:
      labels:
        name: mongo-tasks
        tier: database
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports: 
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: collabflow_tasks

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

          redinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          volumeMounts:
            - name: mongo-tasks-data
              mountPath: /data/db
              
  volumeClaimTemplates:
    - metadata:
        name: mongo-tasks-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual
        resources:
          requests:
            storage: 1Gi

---

################################################################################
################################### Service ####################################
################################################################################

apiVersion: v1
kind: Service
metadata:
  name: mongo-tasks
  namespace: collabflow
  labels:
    name: mongo-tasks
    tier: network
spec:
  clusterIP: None
  selector:
    name: mongo-tasks
    tier: database
  ports:
    - port: 27017
    
   