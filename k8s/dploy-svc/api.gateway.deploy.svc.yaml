############################################################
######################## Deployment ########################
############################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: collabflow
  labels:
    name: api-gateway
    app: collabflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: api-gateway
  template:
    metadata:
      name: api-gateway
      labels:
        name: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory : "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
                
---

############################################################
######################### Service ##########################
############################################################

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: collabflow
  labels:
    name: api-gateway
spec:
  type: ClusterIP
  selector:
    name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      