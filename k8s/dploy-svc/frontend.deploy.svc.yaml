############################################################
######################## Deployment ########################
############################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: collabflow
  labels:
    name: frontend
    app: collabflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: frontend
  template:
    metadata:
      name: frontend
      labels:
        name: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory : "256Mi"

          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          

---

############################################################
######################### Service ##########################
############################################################

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: collabflow
  labels:
    name: frontend
spec:
  type: ClusterIP
  selector:
    name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80      