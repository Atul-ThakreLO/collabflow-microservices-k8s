############################################################
######################## Deployment ########################
############################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: collabflow
  labels:
    name: auth-service
    app: collabflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: auth-service
  template:
    metadata:
      name: auth-service
      labels:
        name: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key:  JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_REFRESH_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory : "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
            
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          

---

############################################################
######################### Service ##########################
############################################################

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: collabflow
  labels:
    name: auth-service
spec:
  type: ClusterIP
  selector:
    name: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
      