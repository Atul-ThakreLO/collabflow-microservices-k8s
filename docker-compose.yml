version: '3.9'

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  collabflow-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo-auth-data:
  mongo-user-data:
  mongo-task-data:
  mongo-notif-data:
  mongo-analytics-data:
  redis-data:
  rabbitmq-data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  mongo-auth:
    image: mongo:7.0
    container_name: mongo-auth
    restart: unless-stopped
    volumes:
      - mongo-auth-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: collabflow_auth
    networks: [collabflow-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-users:
    image: mongo:7.0
    container_name: mongo-users
    restart: unless-stopped
    volumes:
      - mongo-user-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: collabflow_users
    networks: [collabflow-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-tasks:
    image: mongo:7.0
    container_name: mongo-tasks
    restart: unless-stopped
    volumes:
      - mongo-task-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: collabflow_tasks
    networks: [collabflow-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-notifications:
    image: mongo:7.0
    container_name: mongo-notifications
    restart: unless-stopped
    volumes:
      - mongo-notif-data:/data/db
    networks: [collabflow-net]

  mongo-analytics:
    image: mongo:7.0
    container_name: mongo-analytics
    restart: unless-stopped
    volumes:
      - mongo-analytics-data:/data/db
    networks: [collabflow-net]

  redis:
    image: redis:7.2-alpine
    container_name: collabflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [collabflow-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: collabflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"  # Management UI
    networks: [collabflow-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Dev: MailHog for email testing ────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog
    container_name: collabflow-mailhog
    ports:
      - "8025:8025"  # Web UI
    networks: [collabflow-net]

  # ── Application Services ──────────────────────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      target: production
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGO_URI: mongodb://mongo-auth:27017/collabflow_auth
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: super-secret-refresh-jwt-key
      JWT_EXPIRES_IN: 15m
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      LOG_LEVEL: info
      APP_VERSION: 1.0.0
    depends_on:
      mongo-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [collabflow-net]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  user-service:
    build:
      context: ./services/user-service
      target: production
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      MONGO_URI: mongodb://mongo-users:27017/collabflow_users
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      LOG_LEVEL: info
    depends_on:
      mongo-users:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [collabflow-net]

  task-service:
    build:
      context: ./services/task-service
      target: production
    container_name: task-service
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: production
      MONGO_URI: mongodb://mongo-tasks:27017/collabflow_tasks
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      LOG_LEVEL: info
    depends_on:
      mongo-tasks:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [collabflow-net]

  notification-service:
    build:
      context: ./services/notification-service
      target: production
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: production
      MONGO_URI: mongodb://mongo-notifications:27017/collabflow_notifications
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: '"CollabFlow" <noreply@collabflow.io>'
      LOG_LEVEL: info
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [collabflow-net]

  analytics-service:
    build:
      context: ./services/analytics-service
      target: production
    container_name: analytics-service
    restart: unless-stopped
    environment:
      PORT: 3005
      NODE_ENV: production
      MONGO_URI: mongodb://mongo-analytics:27017/collabflow_analytics
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      LOG_LEVEL: info
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [collabflow-net]

  api-gateway:
    build:
      context: ./services/api-gateway
      target: production
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      TASK_SERVICE_URL: http://task-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      CORS_ORIGIN: http://localhost:80,http://localhost:3000
      LOG_LEVEL: info
      APP_VERSION: 1.0.0
    depends_on:
      auth-service:
        condition: service_healthy
    networks: [collabflow-net]

  frontend:
    build:
      context: ./frontend
    container_name: collabflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks: [collabflow-net]
    depends_on:
      - api-gateway
